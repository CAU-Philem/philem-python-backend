services:
  api:
    build: .
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  worker:
    build: .
    command: >
      python -m workers.listing_processor_main
    env_file:
      - .env
    restart: always
